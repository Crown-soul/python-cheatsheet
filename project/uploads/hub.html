<title>Python 學習筆記</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#FFFFFF;
    --paper-raised:#FFFFFF;
    --ink:#1C2321;
    --ink-soft:#5B665F;
    --accent:#3A6B8A;
    --accent-soft:#DCE6EA;
    --line:#D7DBD1;
    --shadow:rgba(28,35,33,0.08);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Source Sans 3', -apple-system, "PingFang TC", "Microsoft JhengHei", sans-serif;
    font-size:16px;
    padding:0 16px;
    line-height:1.65;
  }
  .page{
    max-width:640px;
    margin:0 auto;
    padding-block:44px 60px;
    display:flex;
    flex-direction:column;
    gap:28px;
  }

  .eyebrow{
    font-family:'Barlow Semi Condensed', sans-serif;
    font-weight:600;
    font-size:1rem;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--accent);
  }
  header{
    display:flex;
    flex-direction:column;
    gap:10px;
    padding-bottom:22px;
    border-bottom:1px solid var(--line);
  }
  h1{
    font-family:'Barlow Semi Condensed', sans-serif;
    font-weight:700;
    font-size:clamp(2rem, 7vw, 2.6rem);
    margin:0;
    letter-spacing:0.01em;
    text-wrap:balance;
  }
  .subtitle{
    margin:0;
    color:var(--ink-soft);
    font-size:1.05rem;
    max-width:52ch;
  }

  .list{
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .entry{
    display:flex;
    align-items:center;
    gap:16px;
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-left:4px solid var(--accent);
    border-radius:10px;
    padding:18px 20px;
    box-shadow:0 1px 2px var(--shadow);
    text-decoration:none;
    color:var(--ink);
    transition:border-color 0.15s ease, box-shadow 0.15s ease, transform 0.15s ease;
  }
  .entry:hover{
    border-color:var(--accent);
    box-shadow:0 4px 10px var(--shadow);
    transform:translateY(-1px);
  }
  .entry .text{
    display:flex;
    flex-direction:column;
    gap:3px;
    min-width:0;
  }
  .entry .title{
    font-family:'Barlow Semi Condensed', sans-serif;
    font-weight:700;
    font-size:1.15rem;
  }
  .entry .desc{
    color:var(--ink-soft);
    font-size:0.98rem;
  }
  .entry .arrow{
    margin-left:auto;
    color:var(--ink-soft);
    font-family:'IBM Plex Mono', monospace;
    flex:none;
  }

  .hint{
    font-size:0.98rem;
    color:var(--ink-soft);
    background:var(--accent-soft);
    border-radius:8px;
    padding:12px 16px;
  }

  footer{
    text-align:center;
    color:var(--ink-soft);
    font-size:1rem;
    padding-top:4px;
  }
</style>

<div class="page">

  <header>
    <div class="eyebrow">Index</div>
    <h1>Python 學習筆記</h1>
    <p class="subtitle">上課筆記跟小抄的入口，之後新增的頁面都會加在下面這份清單裡。</p>
  </header>

  <div class="list">
    <a class="entry" href="https://claude.ai/artifact/XzMv32XbL5ajBUPi4zz61J">
      <span class="text">
        <span class="title">Python 小抄</span>
        <span class="desc">VS Code 快捷鍵與零散筆記，隨時查看、持續累積</span>
      </span>
      <span class="arrow">→</span>
    </a>

    <a class="entry" href="https://claude.ai/artifact/YM4WkReh5JTD1BvKJnHkQw">
      <span class="text">
        <span class="title">變數與判斷式</span>
        <span class="desc">本週課程講義：變數、常數、條件判斷、字串格式化，附程式碼示範</span>
      </span>
      <span class="arrow">→</span>
    </a>
  </div>

  <p class="hint">之後有新的講義或小抄要加進來，跟 Claude 說「幫我在 Python 學習筆記目錄加一筆」，並附上這個頁面的連結，就能持續累積。</p>

  <footer>Python 學習筆記 · 目錄</footer>

</div>
